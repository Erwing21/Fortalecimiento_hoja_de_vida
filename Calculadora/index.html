<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Basica de Productos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1> Calculadora de Productos</h1>

    <div class="formulario">
      <label for="producto">Producto:</label>
      <select id="producto">
        <!-- Las opciones se llenan dinámicamente desde app.js -->
      </select>

      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" min="1" value="1">

      <button id="btnCalcular">Calcular</button>
    </div>

    <div class="resultado" id="resultado" hidden>
      <div class="fila">
        <span>Producto:</span>
        <span id="outProducto"></span>
      </div>
      <div class="fila">
        <span>Precio unitario:</span>
        <span id="outPrecio"></span>
      </div>
      <div class="fila">
        <span>Cantidad:</span>
        <span id="outCantidad"></span>
      </div>
      <div class="fila">
        <span>Subtotal:</span>
        <span id="outSubtotal"></span>
      </div>
      <div class="fila total">
        <span>Total final:</span>
        <span id="outTotalFinal"></span>
      </div>
      <p class="descuento-aviso" id="avisoDescuento"></p>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
