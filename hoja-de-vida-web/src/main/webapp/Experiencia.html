<body>
<h1>Registrar experiencia laboral</h1>
<p>Completa estos datos para agregarlos a tu hoja de vida.</p>

    <input name="empresa" placeholder="Empresa" required>
    <input name="duracion" placeholder="Duración (ej: 6 meses)" required>
    <button>Guardar</button>
</form>
